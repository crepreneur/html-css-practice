<!DOCTYPE>
<html lang="kr">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>

  <h1>텍스트 관련 인풋 타입</h1>

  <form action="#">
    <label for="txtIp">text</label> <br>
    <input 
      type="text" 
      id="txtIp" 
      placeholder="5자 이하" 
      maxlength="5"
    >
    <br><br>

    <label for="pwdIp">password</label> <br>
    <input 
      type="password" 
      id="pwdIp" 
      placeholder="4자 이상" 
      minlength="4"
    >
    <br><br>

    <label for="srchIp">search</label> <br>
    <input type="search" id="srchIp">
    <br><br>

    <label for="tlIp">tel</label> <br>
    <input type="tel" id="tlIp">
    <br><br>
    <button type="submit">제출</button>
  </form>

  <br>

  <h1>숫자 관련 인풋 타입</h1>

  <form action="#">
    <label for="numIp">number</label> <br>
    <input 
      type="number" 
      id="numIp" 
      min="0" 
      max="10"
    >
    <br><br>

    <label for="rgIp">range</label> <br>
    <input 
      type="range" 
      id="rgIp" 
      min="0" 
      max="100" 
      step="20"
    >
    <br><br>

    <label for="dtIp">date</label> <br>
    <input 
      type="date" 
      id="dtIp" 
      min="2020-01-01" 
      max="2030-12-31"
    >
    <br><br>

  </form>

  <hr>

  <h1>체크 관련 인풋 타입</h1>

  <form action="#">
    <h2>checkbox</h2>
    <input 
      id="cbIp"
      type="checkbox"
      checked
    >
    <label for="cbIp">유기농</label> <br>

    <h2>radio</h2>
    <input
      type="radio"
      name="fruit"
      id="f_apple"
      value="apple"
      checked
    >
    <label for="f_apple">사과</label>
    <input
      type="radio"
      name="fruit"
      id="f_grape"
      value="grape"
    >
    <label for="f_grape">포도</label>
    <input
      type="radio"
      name="fruit"
      id="f_orange"
      value="orange"
    >
    <label for="f_orange">오렌지</label>
    <br>

    <input
      type="radio"
      name="vege"
      id="v_carrot"
      value="carrot"
      checked
    >
    <label for="v_carrot">당근</label>
    <input
      type="radio"
      name="vege"
      id="v_tomato"
      value="tomato"
    >
    <label for="v_tomato">토마토</label>
    <input
      type="radio"
      name="vege"
      id="v_eggplant"
      value="eggplant"
    >
    <label for="v_eggplant">가지</label>

  </form>

  <hr>

  <h1>기타 인풋 타입</h1>

  <form action="#">
    <label for="fileIp">file</label> <br>
    <input 
      type="file" 
      id="fileIp" 
      accept="image/png, image/jpeg" 
      multiple
    >
    <br><br>

    <label for="hdnIp">hidden</label> <br>
    <input 
      type="hidden" 
      id="hdnIp"
    >
  </form>

  <br><hr><br>

  <form action="#">
    <label for="emlIp">email</label> <br>
    <input 
      type="email" 
      id="emlIp"
    >
    <br><br>

    <button type="submit">제출</button>
  </form>

  <hr>

  <h1>인풋 요소 공통(대부분) 속성</h1>

  <form action="#">
    <label for="valIp">value</label> <br>
    <input 
      type="text" 
      id="valIp" 
      value="지정됨"
    >
    <br><br>

    <label for="afIp">autofocus</label> <br>
    <input 
      type="text" 
      id="afIp" 
      placeholder="자동 포커스됨" 
      autofocus
    >
    <br><br>

    <label for="roIp">readonly</label> <br>
    <input
      id-="roIp"  
      type="text" 
      value="읽기만 가능, 전송됨" 
      readonly
    >
    <br><br>

    <label for="rqIp"></label> <br>
    <input 
      type="text" 
      id="rqIp" 
      placeholder="필수입력!" 
      required
    >
    <br><br>

    <label for="daIp">disabled</label> <br>
    <input 
      type="text" 
      id="daIp" 
      placeholder="입력불가, 전송 안됨"
      disabled
    >
    <br><br>
     <input
      type="radio"
      name="fruit"
      id="f_apple"
      value="apple"
      checked
    >
    <label for="f_apple">사과</label>
    <input
      type="radio"
      name="fruit"
      id="f_grape"
      value="grape"
    >
    <label for="f_grape">포도</label>
    <input
      type="radio"
      name="fruit"
      id="f_orange"
      value="orange"
      disabled
    >
    <label for="f_orange">오렌지(품절)</label>
    <br>

    <br><br>

    <button type="submit">제출</button>


  </form>

</body>
</html>
